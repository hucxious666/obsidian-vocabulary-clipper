<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Obsidian 词汇采集器设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <header>
      <div class="mark">W</div>
      <div><h1>Obsidian 词汇采集器</h1><p>选区查词与翻译，并将单词加入指定章节或笔记末尾。</p></div>
    </header>

    <section>
      <h2>Markdown 文件</h2>
      <label for="section-file">章节笔记</label>
      <div class="path-row"><input id="section-file" type="text"><button data-browse="section">浏览…</button></div>
      <label for="append-file">末尾追加笔记</label>
      <div class="path-row"><input id="append-file" type="text"><button data-browse="append">浏览…</button></div>
      <label for="section-select">当前章节</label>
      <select id="section-select"></select>
      <label for="new-section">新增章节（二级标题）</label>
      <div class="path-row">
        <input id="new-section" type="text" maxlength="80" placeholder="例如：Match Review">
        <button id="create-section" type="button">新增章节</button>
      </div>
    </section>

    <section>
      <h2>浏览体验</h2>
      <label class="check-row" for="double-click-lookup">
        <input id="double-click-lookup" type="checkbox">
        <span><strong>网页选区查词与翻译</strong><small>选中英文单词显示释义，选中英文句子显示翻译。</small></span>
      </label>
      <label class="check-row" for="auto-open-pdf">
        <input id="auto-open-pdf" type="checkbox">
        <span><strong>自动使用词汇 PDF 阅读器</strong><small>顶层 PDF 自动进入支持双击查词的阅读页。</small></span>
      </label>
      <p class="hint">本地 PDF 还需在 Chrome 扩展详情中开启“允许访问文件网址”。</p>
    </section>

    <section>
      <div class="section-title"><h2>百度翻译</h2><span id="credential-status" class="status">未配置</span></div>
      <p class="hint">凭据会由 Windows DPAPI 加密保存在本机。已配置时留空即可保持不变。</p>
      <label for="app-id">APP ID</label>
      <input id="app-id" type="password" autocomplete="off" placeholder="输入新的 APP ID">
      <label for="secret-key">密钥</label>
      <input id="secret-key" type="password" autocomplete="off" placeholder="输入新的密钥">
    </section>

    <section>
      <div class="section-title"><h2>有道文本翻译后备</h2><span id="youdao-credential-status" class="status">未配置</span></div>
      <p class="hint">百度翻译失败时自动使用有道 NMT。凭据使用 Windows DPAPI 加密，测试结果不会写入笔记或缓存。</p>
      <label for="youdao-app-key">App Key</label>
      <input id="youdao-app-key" type="password" autocomplete="off" placeholder="输入新的 App Key">
      <label for="youdao-secret-key">App Secret</label>
      <input id="youdao-secret-key" type="password" autocomplete="off" placeholder="输入新的 App Secret">
      <label for="youdao-test-text">测试句子</label>
      <div class="path-row">
        <input id="youdao-test-text" type="text" value="Liverpool are playing well." autocomplete="off">
        <button id="test-youdao" class="secondary">测试有道翻译</button>
      </div>
      <pre id="youdao-preview" class="preview" hidden></pre>
    </section>

    <footer>
      <span id="message" role="status"></span>
      <button id="test" class="secondary">测试连接</button>
      <button id="save" class="primary">保存设置</button>
    </footer>
  </main>
  <script src="lib.js"></script>
  <script src="options.js"></script>
</body>
</html>
